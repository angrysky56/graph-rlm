[project]
name = "graph-rlm"
version = "0.1.0"
description = "Self-Healing Recursive Language Model with Graph Memory"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "falkordb>=1.4.0",
    "fastapi>=0.128.0",
    "langchain>=1.2.7",
    "langchain-community>=0.4.1",
    "networkx>=3.6.1",
    "numpy>=2.4.1",
    "ollama>=0.6.1",
    "openai>=2.15.0",
    "openrouter>=0.1.3",
    "pydantic-settings>=2.12.0",
    "uvicorn[standard]>=0.40.0",
    "termcolor>=2.4.0",
    "pandas>=2.0.0",
    "mcp>=1.26.0",
    "nest-asyncio>=1.6.0",
    "pymupdf>=1.26.7",
    "ascii-magic>=2.7.4",
    "pillow>=12.1.0",
    "pytest>=9.0.2",
    "tiktoken>=0.12.0",
    "psutil>=7.2.2",
    "unidecode>=1.4.0",
    "scipy>=1.17.0",
    "structlog>=24.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = """
    -v
    --tb=short
    --cov=graph_rlm.backend.src
    --cov-context=test
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-report=lcov:coverage.lcov
"""

[tool.coverage.run]
source = ["graph_rlm.backend.src"]
omit = ["*/tests/*", "*/__pycache__/*", "*/migrations/*"]
branch = true

[tool.coverage.run.per_module]
# Per-module coverage tracking

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]

# Coverage thresholds for infrastructure modules
fail_under = 85

[tool.coverage.report.partial]
# Partial coverage exclusions by module
ignore_errors = false

[tool.coverage.html]
title = "Graph-RLM Coverage Report"
show_contexts = true
