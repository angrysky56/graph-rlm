[project]
name = "graph-rlm"
version = "0.1.0"
description = "A recursive, graph-based language model agent with PyQt UI."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "falkordb>=1.4.0",
    "langchain-community>=0.3.16",
    "numpy>=2.2.2",
    "python-dotenv>=1.0.1",
    "requests>=2.32.3",
    "PyQt6>=6.6.1",
    # Restored Core Dependencies
    "openai>=1.12.0",
    "ollama>=0.1.6",
    "networkx>=3.2.1",
    "mcp>=1.2.0",
    "pydantic-settings>=2.1.0",
    "tiktoken>=0.6.0",
    "openrouter>=0.1.3",
    # Additional utils likely used
    "pandas>=2.0.0",
    "termcolor>=2.4.0",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
